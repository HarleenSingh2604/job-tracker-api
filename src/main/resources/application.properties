spring.application.name=job-tracker-api
spring.datasource.url=jdbc:h2:file:./data/jobtracker;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Override JWT_SECRET in real deployments (min 32 characters)
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
app.jwt.expiration-ms=3600000
